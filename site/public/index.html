<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIFF 2026 — Full Catalogue · 第28届上海国际电影节</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: oklch(0.985 0.005 80);
    --bg-warm: oklch(0.965 0.008 70);
    --ink: oklch(0.18 0.01 70);
    --ink-soft: oklch(0.32 0.01 70);
    --ink-mute: oklch(0.55 0.01 70);
    --rule: oklch(0.86 0.01 70);
    --rule-soft: oklch(0.92 0.008 70);
    --accent: #c8392a;
    --paper: oklch(0.99 0.004 80);

    --display: "Instrument Serif", "Noto Serif SC", Georgia, serif;
    --sans: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --zh: "Noto Sans SC", "IBM Plex Sans", sans-serif;
    --zh-serif: "Noto Serif SC", "Instrument Serif", serif;

    --pad: clamp(20px, 3.2vw, 56px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body[data-density="compact"]  { --pad: clamp(16px, 2.4vw, 36px); font-size: 14px; }
  body[data-density="airy"]     { --pad: clamp(28px, 4.6vw, 80px); font-size: 16px; }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  ::selection { background: var(--accent); color: var(--paper); }

  .mono { font-family: var(--mono); font-feature-settings: "tnum" 1; letter-spacing: -0.005em; }
  .zh { font-family: var(--zh); }
  .zh-serif { font-family: var(--zh-serif); }
  .display { font-family: var(--display); font-weight: 400; }
  .italic { font-style: italic; }

  /* ---------- Header ---------- */
  header.site {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in oklab, var(--bg) 92%, transparent);
    backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  header.site .row {
    display: flex; align-items: center; gap: 24px;
    padding: 14px var(--pad);
  }
  .brand {
    display: flex; align-items: baseline; gap: 10px;
    font-family: var(--display); font-size: 22px; line-height: 1;
    letter-spacing: -0.01em;
  }
  .brand .b-mark {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-mute);
    padding: 4px 7px; border: 1px solid var(--rule);
    border-radius: 2px;
    align-self: center;
  }
  .brand .b-zh { font-family: var(--zh-serif); font-size: 14px; color: var(--ink-soft); letter-spacing: 0.05em; }
  nav.top {
    display: flex; gap: 22px; margin-left: auto;
    font-size: 13px;
  }
  nav.top a {
    color: var(--ink-soft);
    padding: 6px 0;
    border-bottom: 1px solid transparent;
    transition: border-color .15s, color .15s;
  }
  nav.top a:hover, nav.top a.active { color: var(--ink); border-bottom-color: var(--accent); }
  .nav-zh { color: var(--ink-mute); font-family: var(--mono); font-size: 11px; margin-left: 4px; }

  .lang-toggle {
    display: inline-flex; align-items: center; gap: 0;
    border: 1px solid var(--rule); border-radius: 999px;
    padding: 2px; font-size: 11px;
  }
  .lang-toggle button {
    padding: 4px 10px; border-radius: 999px; color: var(--ink-mute);
    letter-spacing: 0.04em;
  }
  .lang-toggle button.on { background: var(--ink); color: var(--paper); }

  .wl-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 11px 5px 9px;
    border: 1px solid var(--rule); border-radius: 999px;
    color: var(--ink-soft);
    font-size: 12px;
    transition: border-color .12s, color .12s, background .12s;
    cursor: pointer;
  }
  .wl-pill:hover { border-color: var(--ink); color: var(--ink); }
  .wl-pill.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .wl-pill .wl-n {
    font-size: 11px;
    min-width: 18px; text-align: center; padding: 1px 5px; border-radius: 999px;
    background: color-mix(in oklab, var(--ink) 8%, transparent);
  }
  .wl-pill.on .wl-n { background: color-mix(in oklab, var(--paper) 22%, transparent); }
  .wl-pill svg { width: 13px; height: 13px; }

  /* ---------- Filter bar ---------- */
  .filter-bar {
    position: sticky; top: 56px; z-index: 30;
    background: color-mix(in oklab, var(--bg) 94%, transparent);
    backdrop-filter: saturate(140%) blur(8px);
    border-bottom: 1px solid var(--rule);
    padding: 14px var(--pad);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .search {
    flex: 1 1 320px; min-width: 240px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--ink);
    padding: 6px 0;
  }
  .search svg { width: 14px; height: 14px; flex: none; color: var(--ink-soft); }
  .search input {
    flex: 1; border: 0; outline: none; background: transparent;
    font: inherit; font-family: var(--display); font-size: 22px;
    color: var(--ink); letter-spacing: -0.01em;
  }
  .search input::placeholder { color: var(--ink-mute); font-style: italic; }
  .search .count {
    font-family: var(--mono); font-size: 11px; color: var(--ink-mute); letter-spacing: 0.08em;
  }

  .chip {
    font: inherit; font-size: 12px;
    padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px;
    color: var(--ink-soft); white-space: nowrap;
    transition: background .12s, color .12s, border-color .12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip .x { opacity: 0.6; }

  .select { position: relative; }
  .select select {
    appearance: none; -webkit-appearance: none;
    font: inherit; font-size: 12px;
    padding: 7px 28px 7px 12px;
    border: 1px solid var(--rule); border-radius: 999px;
    background: transparent; color: var(--ink-soft); cursor: pointer;
  }
  .select::after {
    content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-size: 10px; color: var(--ink-mute); pointer-events: none;
  }
  .select select:hover { border-color: var(--ink); color: var(--ink); }

  .filter-bar .clear {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent);
    padding: 6px 0; border-bottom: 1px solid transparent;
  }
  .filter-bar .clear:hover { border-bottom-color: var(--accent); }

  .active-row {
    padding: 10px var(--pad) 0;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .active-row .lab {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-mute); align-self: center; margin-right: 4px;
  }

  /* ---------- Catalog ---------- */
  .catalog { padding: clamp(28px, 4vw, 56px) var(--pad); }
  .catalog .group-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
    border-top: 1px solid var(--ink);
    padding-top: 14px; margin-top: 36px; margin-bottom: 22px;
  }
  .catalog .group-head:first-child { margin-top: 0; }
  .catalog .group-head .gh-left { min-width: 0; }
  .catalog .group-head .gh-kind {
    display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
  }
  .catalog .group-head h2 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(28px, 3.6vw, 52px);
    line-height: 1; letter-spacing: -0.015em;
    margin: 0;
  }
  .catalog .group-head h2 .zh-tag {
    font-family: var(--zh-serif); font-size: 0.42em; color: var(--ink-soft); margin-left: 16px;
    letter-spacing: 0.04em;
  }
  .catalog .group-head .gh-blurb {
    font-family: var(--sans); font-size: 13px; line-height: 1.5;
    color: var(--ink-soft); margin: 10px 0 0; max-width: 64ch;
  }
  .catalog .group-head .group-count {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    color: var(--ink-mute); text-transform: uppercase;
    white-space: nowrap; padding-top: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
    gap: 0;
    border-top: 1px solid var(--rule);
    border-left: 1px solid var(--rule);
  }
  body[data-density="compact"] .grid { grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); }
  body[data-density="airy"]    .grid { grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); }

  .card {
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 18px 20px 22px;
    background: var(--bg);
    cursor: pointer;
    transition: background .15s;
    display: flex; flex-direction: column; gap: 14px;
    text-align: left;
    width: 100%;
  }
  .card:hover { background: var(--paper); }
  .card .poster {
    aspect-ratio: 3 / 4;
    position: relative;
    overflow: hidden;
    background-color: var(--poster, var(--rule-soft));
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 14px,
      rgba(0,0,0,0.06) 14px 15px
    );
    border: 1px solid color-mix(in oklab, var(--poster, var(--rule)) 70%, black 8%);
  }
  .card .poster img,
  .m-poster img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .poster img {
    position: absolute; inset: 0; z-index: 1;
    background: var(--poster, var(--rule-soft));
  }
  body[data-posters="off"] .card .poster img { display: none; }
  .card .poster .corner, .card .poster .fmt-tag, .card .poster .placeholder-tag, .card .poster .watch-btn { z-index: 2; }
  .card .poster.has-img .placeholder-tag { opacity: 0; }
  body[data-posters="off"] .card .poster.has-img .placeholder-tag { opacity: 0.8; }

  .card .poster .corner {
    position: absolute; left: 10px; top: 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    color: var(--paper); background: rgba(0,0,0,0.55);
    padding: 3px 6px; border-radius: 2px;
  }
  .card .poster .placeholder-tag {
    position: absolute; left: 10px; bottom: 10px; right: 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    color: var(--paper); text-transform: lowercase;
    opacity: 0.75;
  }
  .card .poster .fmt-tag {
    position: absolute; right: 8px; top: 8px;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
    color: var(--paper); background: var(--accent);
    padding: 3px 6px; border-radius: 2px; text-transform: uppercase;
  }
  .card .poster .watch-btn {
    position: absolute; right: 8px; bottom: 8px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    transition: background .12s, transform .12s;
  }
  .card .poster .watch-btn:hover { background: rgba(0,0,0,0.75); transform: scale(1.08); }
  .card .poster .watch-btn.on { background: var(--accent); }

  .card h3 {
    margin: 0;
    font-family: var(--display); font-weight: 400;
    font-size: 26px; line-height: 1.05;
    letter-spacing: -0.012em;
  }
  .card h3 em { color: var(--ink-soft); }
  .card .h-zh {
    font-family: var(--zh-serif); font-size: 14px; color: var(--ink-soft);
    margin-top: 2px; line-height: 1.2;
  }
  body[data-lang-emphasis="en"] .card .h-zh { display: none; }
  body[data-lang-emphasis="zh"] .card h3 .en { font-size: 0.7em; color: var(--ink-mute); font-style: italic; display: block; margin-top: 4px; }
  body[data-lang-emphasis="zh"] .card .h-zh { font-size: 24px; color: var(--ink); margin-top: 0; margin-bottom: 4px; font-weight: 600; }
  body[data-lang-emphasis="zh"] .card h3 { font-size: 16px; font-style: italic; color: var(--ink-soft); }

  .card .meta-row {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 6px;
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-mute); letter-spacing: 0.04em;
  }
  body:not([data-mono="on"]) .card .meta-row { font-family: var(--sans); letter-spacing: 0; }
  .card .meta-row .line { display: flex; gap: 10px; justify-content: space-between; }
  .card .meta-row .line .dir { color: var(--ink-soft); }
  .card .badge-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .badge {
    padding: 3px 6px; border: 1px solid var(--rule); border-radius: 2px;
    color: var(--ink-soft); white-space: nowrap;
  }
  .badge.featured { background: var(--accent); color: var(--paper); border-color: var(--accent); }

  .empty { padding: 80px 0; text-align: center; color: var(--ink-mute); }
  .empty .big { font-family: var(--display); font-size: 48px; line-height: 1; margin-bottom: 12px; font-style: italic; color: var(--ink-soft); }

  /* ---------- Programs index view (Programme landing) ---------- */
  .programs-view { padding: 0 var(--pad); }

  .pw-hero {
    position: relative; overflow: hidden;
    margin: 0 calc(-1 * var(--pad)) 0;
    background: var(--ink);
    height: min(70vh, 700px); min-height: 460px;
    display: flex; flex-direction: column; justify-content: center; gap: 12px;
  }
  .pw-row {
    display: flex; gap: 12px; width: max-content; padding-left: 12px;
    animation: pw-marq 90s linear infinite; will-change: transform;
  }
  .pw-row.rev { animation-direction: reverse; }
  .pw-row:hover { animation-play-state: paused; }
  @keyframes pw-marq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .pw-tile {
    flex: none; height: clamp(150px, 19vh, 200px); aspect-ratio: 2 / 3;
    padding: 0; border: 0; overflow: hidden; cursor: pointer;
    background: var(--ink-soft); border-radius: 2px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .pw-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pw-tile:hover { transform: scale(1.045); box-shadow: 0 8px 26px rgba(0,0,0,0.55); z-index: 4; position: relative; }
  .pw-scrim {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(16,14,12,0.30) 0%, rgba(16,14,12,0) 26%,
      rgba(16,14,12,0.42) 60%, rgba(16,14,12,0.93) 100%);
  }
  .pw-masthead {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 0 var(--pad) clamp(22px, 3.2vw, 44px); pointer-events: none;
  }
  .pv-eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-mute); margin-bottom: 16px;
  }
  .pw-masthead .pv-eyebrow { color: rgba(255,255,255,0.74); margin-bottom: 12px; }
  .pw-masthead h1 {
    font-family: var(--display); font-weight: 400; margin: 0; color: var(--paper);
    font-size: clamp(44px, 8vw, 104px); line-height: 0.9; letter-spacing: -0.025em;
    text-shadow: 0 2px 24px rgba(0,0,0,0.4);
  }
  .pw-masthead h1 .pv-zh { font-family: var(--zh-serif); font-size: 0.28em; color: rgba(255,255,255,0.78); margin-left: 18px; text-shadow: none; }
  .pw-lead {
    font-family: var(--sans); font-size: clamp(13px, 1.5vw, 16px); color: rgba(255,255,255,0.82);
    margin: 14px 0 0; letter-spacing: 0.01em; text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  @media (prefers-reduced-motion: reduce) { .pw-row { animation: none; } }

  .pv-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap;
    border-bottom: 1px solid var(--ink); padding: 22px 0 24px; margin-bottom: 4px;
  }
  .pv-search {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--ink); padding: 8px 0;
    flex: 1 1 380px;
  }
  .pv-search svg { width: 16px; height: 16px; flex: none; color: var(--ink-soft); }
  .pv-search input {
    flex: 1; border: 0; outline: none; background: transparent; font: inherit;
    font-family: var(--display); font-size: clamp(20px, 2.2vw, 26px);
    color: var(--ink); letter-spacing: -0.01em;
  }
  .pv-search input::placeholder { color: var(--ink-mute); font-style: italic; }
  .pv-search-go {
    flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); padding: 6px 0; border-bottom: 1px solid transparent;
  }
  .pv-search-go:hover { border-bottom-color: var(--accent); }
  .pv-bar-stats { display: flex; gap: 26px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
  .pv-bar-stats b { font-family: var(--display); font-size: 24px; font-weight: 400; color: var(--ink); margin-right: 7px; }
  @media (max-width: 640px) { .pv-bar-stats { display: none; } }

  .kind-block { margin-top: 44px; }
  .kind-head {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-top: 1px solid var(--rule); padding-top: 14px; margin-bottom: 18px;
  }
  .kind-head h2 {
    font-family: var(--display); font-weight: 400; margin: 0; white-space: nowrap; flex: 0 0 auto;
    font-size: clamp(24px, 2.6vw, 34px); line-height: 1; letter-spacing: -0.01em;
  }
  .kind-head .kind-zh { font-family: var(--zh-serif); font-size: 16px; color: var(--ink-soft); flex: 0 0 auto; }
  .kind-head .kind-count {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute);
  }
  .prog-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
    gap: 0; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule);
  }
  .prog-card {
    position: relative; text-align: left; width: 100%;
    border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: 20px 22px 22px; background: var(--bg);
    display: flex; flex-direction: column; gap: 6px;
    transition: background .14s;
  }
  .prog-card:hover { background: var(--paper); }
  .prog-card .pc-bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pc, var(--accent));
    opacity: 0.85;
  }
  .prog-card .pc-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: var(--ink-mute); letter-spacing: 0.06em; margin-bottom: 2px;
  }
  .prog-card .pc-name {
    font-family: var(--display); font-size: clamp(22px, 2vw, 28px);
    line-height: 1.04; letter-spacing: -0.01em; color: var(--ink);
  }
  .prog-card .pc-zh { font-family: var(--zh-serif); font-size: 14px; color: var(--ink-soft); }
  .prog-card .pc-blurb {
    font-family: var(--sans); font-size: 12.5px; line-height: 1.5;
    color: var(--ink-soft); margin-top: 8px;
  }
  .prog-card .pc-go {
    margin-top: 12px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-mute); transition: color .12s;
  }
  .prog-card:hover .pc-go { color: var(--accent); }

  /* ---------- Watchlist view ---------- */
  .watchlist-view { padding: clamp(28px, 4vw, 56px) var(--pad) 0; }
  .wl-head {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
    border-bottom: 1px solid var(--ink); padding-bottom: 28px;
  }
  .wl-head h1 {
    font-family: var(--display); font-weight: 400; margin: 0;
    font-size: clamp(44px, 7vw, 88px); line-height: 0.92; letter-spacing: -0.025em;
  }
  .wl-head h1 .pv-zh { font-family: var(--zh-serif); font-size: 0.3em; color: var(--ink-soft); margin-left: 16px; }
  .pv-lead {
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    color: var(--ink-soft); margin: 16px 0 0; max-width: 52ch;
  }
  .wl-head .pv-lead { margin-top: 12px; }
  .wl-note { color: var(--ink-mute); }
  .wl-clear {
    flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); padding: 6px 0; border-bottom: 1px solid transparent;
  }

  .wl-empty { padding: 80px 0 100px; max-width: 44ch; }

  /* ---------- Footer ---------- */

  footer.site h4 {

  footer.site .fan-note {

  footer.site .fan-note .zh { font-family: var(--zh-serif); font-size: 18px; display: block; margin-top: 8px; color: var(--ink-soft); }
  footer.site .colophon ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  footer.site .small {

  /* ---------- Modal ---------- */

    background: color-mix(in oklab, var(--ink) 50%, transparent);
    backdrop-filter: blur(6px);
    display: flex; align-items: flex-start; justify-content: center;
    padding: clamp(16px, 4vw, 56px);
    overflow-y: auto;
    animation: scrim-in .18s ease-out;
  }
  @keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg);
    width: min(1100px, 100%);
    border: 1px solid var(--ink);
    position: relative;
    animation: modal-in .26s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .modal .close {
    position: absolute; right: 16px; top: 16px;
    width: 36px; height: 36px;
    border: 1px solid var(--rule); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--ink-soft);
    z-index: 2; background: var(--bg);
  }
  .modal .close:hover { color: var(--ink); border-color: var(--ink); }

  .m-head {
    padding: clamp(32px, 5vw, 64px) clamp(28px, 4vw, 56px) clamp(20px, 3vw, 32px);
    border-bottom: 1px solid var(--rule);

  }
  .m-head .crest .sec { color: var(--accent); }
  .m-head .crest button.sec {
    color: var(--accent); font: inherit; font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 1px solid transparent;
  }
  .m-head .crest button.sec:hover { border-bottom-color: var(--accent); }
  .m-head .crest .fmt { color: var(--ink); border: 1px solid var(--rule); padding: 1px 6px; border-radius: 2px; }
  .m-head .crest .premiere { color: var(--paper); background: var(--accent); padding: 1px 8px; border-radius: 2px; letter-spacing: 0.12em; }
  .m-head h2 {
    margin: 0;
    font-family: var(--display); font-weight: 400;
    font-size: clamp(40px, 6vw, 88px);
    line-height: 0.95; letter-spacing: -0.02em;
  }
  .m-head h2 em { color: var(--accent); }
  .m-head .h-zh {
    font-family: var(--zh-serif); font-size: clamp(20px, 2.4vw, 32px);
    color: var(--ink-soft); margin-top: 14px; letter-spacing: 0.04em;
  }
  .m-head .tagline {
    display: flex; gap: 24px; margin-top: 28px; flex-wrap: wrap;
    font-size: 13px; color: var(--ink-soft);
  }
  .m-head .tagline .k {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-mute);

  }

  .m-body { display: grid; grid-template-columns: 2fr 1fr; gap: 0; }
  @media (max-width: 800px) { .m-body { grid-template-columns: 1fr; } }
  .m-body .col { padding: clamp(24px, 4vw, 40px) clamp(28px, 4vw, 56px); }
  .m-body .col + .col { border-left: 1px solid var(--rule); }
  @media (max-width: 800px) { .m-body .col + .col { border-left: 0; border-top: 1px solid var(--rule); } }

  .m-body h3 {
    margin: 0 0 12px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-mute); font-weight: 500;
  }
  .m-body p {
    margin: 0 0 18px;
    font-family: var(--display); font-size: clamp(18px, 1.8vw, 22px);
    line-height: 1.45; letter-spacing: -0.005em;
    color: var(--ink);
    max-width: 60ch;
  }
  .m-body p.zh {
    font-family: var(--zh-serif); font-size: clamp(15px, 1.5vw, 17px);
    line-height: 1.7; color: var(--ink-soft); letter-spacing: 0.02em;
  }
  .m-body p.muted { color: var(--ink-mute); font-style: italic; }

  .m-poster {
    aspect-ratio: 2 / 3; width: 100%; overflow: hidden;
    border: 1px solid color-mix(in oklab, var(--ink) 20%, transparent);

  .imdb-link {
    margin-top: 16px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border: 1px solid var(--ink); border-radius: 999px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    color: var(--ink); transition: background .12s, color .12s;
  }
  .imdb-link:hover { background: var(--ink); color: var(--paper); }
  .imdb-link svg { width: 13px; height: 13px; }

  .modal-wl {
    margin-top: 16px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--ink); border-radius: 999px;
    font-size: 12px; color: var(--ink);
    font-family: var(--mono); letter-spacing: 0.06em;
    transition: background .12s, color .12s;
  }
  .modal-wl:hover { background: var(--ink); color: var(--paper); }
  .modal-wl.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .modal-wl svg { width: 13px; height: 13px; }

  .prog-note { margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 18px; }
  .prog-note .k { display: block; margin-bottom: 8px; color: var(--ink-mute); }
  .prog-note .pn-name {
    font-family: var(--display); font-size: 22px; line-height: 1.1; letter-spacing: -0.01em;
    color: var(--ink); text-align: left; border-bottom: 1px solid transparent;
  }
  .prog-note .pn-name:hover { border-bottom-color: var(--accent); color: var(--accent); }
  .prog-note p {

  }

  /* ---------- My Plan pill (header) ---------- */
  .wl-pill.plan-pill.on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  header.site nav.top a { white-space: nowrap; }
  header.site .wl-pill { white-space: nowrap; }
  header.site .wl-pill span { white-space: nowrap; }

  /* ---------- Calendar planner ---------- */
  .cal-view { padding: clamp(28px, 4vw, 56px) var(--pad) 0; }
  .cal-head-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cal-modes { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
  .cal-modes button { padding: 6px 15px; border-radius: 999px; font-size: 12px; color: var(--ink-mute); }
  .cal-modes button.on { background: var(--ink); color: var(--paper); }
  .cal-add-btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px;

  .cal-wrap { margin-top: 24px; overflow-x: auto; border: 1px solid var(--ink); scrollbar-width: thin; }
  .cal-grid { display: grid; min-width: max-content; }
  .cal-corner {

  }
  .cal-dayhead.weekend { background: var(--bg-warm); }
  .cal-dayhead .cdh-dow { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
  .cal-dayhead .cdh-d { font-family: var(--display); font-size: 26px; line-height: 1; letter-spacing: -0.01em; }
  .cal-dayhead .cdh-mon { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }

  .cal-slotlabel {
    position: sticky; left: 0; z-index: 2; background: var(--bg-warm);
    border-right: 1px solid var(--ink); border-bottom: 1px solid var(--rule);
    padding: 12px 9px; display: flex; flex-direction: column; gap: 1px;
  }
  .cal-slotlabel .csl-time { font-family: var(--mono); font-size: 11px; color: var(--ink); }
  .cal-slotlabel .csl-time-end { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); }
  .cal-slotlabel .csl-label { font-size: 10px; letter-spacing: 0.03em; color: var(--ink-soft); margin-top: 5px; }

  .cal-cell {
    border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: 6px; min-height: 86px; display: flex; flex-direction: column; gap: 5px; background: var(--bg);
  }
  .cal-cell.weekend { background: color-mix(in oklab, var(--bg-warm) 55%, var(--bg)); }

  .cal-chip {
    position: relative; display: flex; align-items: stretch; overflow: hidden;
    border: 1px solid color-mix(in oklab, var(--pc, var(--rule)) 45%, var(--rule));
    border-left: 3px solid var(--pc, var(--accent)); border-radius: 3px; background: var(--paper);
  }
  .cal-chip-main { text-align: left; padding: 6px 7px; display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .cal-chip .cc-title {
    font-family: var(--display); font-size: 14px; line-height: 1.05; color: var(--ink);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .cal-chip .cc-venue {
    display: flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 9px;
    color: var(--ink-mute); letter-spacing: 0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cal-chip .cc-venue svg { width: 9px; height: 9px; flex: none; }
  .cal-chip-x { width: 20px; flex: none; color: var(--ink-mute); font-size: 14px; display: flex; align-items: center; justify-content: center; transition: background .1s, color .1s; }
  .cal-chip-x:hover { background: var(--accent); color: var(--paper); }

  .cal-add {
    margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 5px; border: 1px dashed var(--rule); border-radius: 3px; color: var(--ink-mute);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; transition: border-color .12s, color .12s;
  }
  .cal-add svg { width: 12px; height: 12px; }
  .cal-add:hover { border-color: var(--accent); color: var(--accent); }
  .cal-cell:not(.filled) .cal-add { min-height: 34px; }
  .cal-hint { margin: 12px 0 0; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); }

  /* ---------- Agenda (My Plan day-by-day) ---------- */
  .plan-days { margin-top: 8px; }
  .plan-day-head {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-top: 1px solid var(--ink); padding-top: 14px; margin-top: 30px;
  }
  .plan-day-head .pd-dow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }

  .plan-day-head .pd-zh { font-family: var(--zh-serif); font-size: 15px; color: var(--ink-soft); }
  .plan-day-head .pd-count { margin-left: auto; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
  .plan-rows { margin-top: 14px; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .plan-row {

  .pr-poster {

    background-image: repeating-linear-gradient(135deg, transparent 0 9px, rgba(0,0,0,0.06) 9px 10px);
    border: 1px solid color-mix(in oklab, var(--ink) 14%, transparent);

  .pr-title { font-family: var(--display); font-size: 23px; line-height: 1.04; letter-spacing: -0.012em; color: var(--ink); }
  .pr-zh { font-family: var(--zh-serif); font-size: 13px; color: var(--ink-soft); }

  .pr-remove {

  .pr-remove:hover { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  @media (max-width: 680px) {
    .plan-row { grid-template-columns: 56px 1fr 32px; }
    .pr-time { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 12px; }
  }

  /* ---------- Entry picker (modal) ---------- */
  .picker-scrim {
    position: fixed; inset: 0; z-index: 120;
    background: color-mix(in oklab, var(--ink) 50%, transparent); backdrop-filter: blur(6px);
    display: flex; align-items: flex-start; justify-content: center;

  }

    animation: modal-in .26s cubic-bezier(.2,.7,.2,1);
  }
  .picker .close {
    position: absolute; right: 14px; top: 14px; width: 34px; height: 34px;
    border: 1px solid var(--rule); border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--ink-soft); background: var(--bg); z-index: 2;
  }
  .picker .close:hover { color: var(--ink); border-color: var(--ink); }
  .picker-head { padding: 26px 28px 18px; border-bottom: 1px solid var(--rule); flex: none; }
  .picker-head h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3vw, 38px); margin: 6px 0 0; line-height: 1; letter-spacing: -0.012em; }

  .picker-body { overflow-y: auto; padding: 0 28px; }
  .pk-sec { padding: 20px 0; border-bottom: 1px solid var(--rule); }

  .pk-sec h3 { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin: 0 0 14px; font-weight: 500; }

  .pk-zh { font-family: var(--zh-serif); letter-spacing: 0; text-transform: none; color: var(--ink-soft); }
  .pk-chosen { margin-left: auto; color: var(--accent); font-size: 10px; text-transform: none; letter-spacing: 0; max-width: 52%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pk-search { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink); padding: 6px 0; }
  .pk-search svg { width: 14px; height: 14px; color: var(--ink-soft); flex: none; }
  .pk-search input { flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-family: var(--display); font-size: 20px; color: var(--ink); }
  .pk-search input::placeholder { color: var(--ink-mute); font-style: italic; }
  .pk-listnote { margin: 12px 0 4px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
  .pk-film-list { max-height: 244px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--rule); scrollbar-width: thin; }
  .pk-film { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule-soft); transition: background .1s; }
  .pk-film:last-child { border-bottom: 0; }
  .pk-film:hover { background: var(--paper); }
  .pk-film.on { background: color-mix(in oklab, var(--accent) 8%, var(--bg)); }
  .pk-film-poster {
    width: 34px; height: 48px; flex: none; border-radius: 2px; overflow: hidden;
    background-image: repeating-linear-gradient(135deg, transparent 0 7px, rgba(0,0,0,0.07) 7px 8px);

  }

  .pk-days { display: flex; flex-wrap: wrap; gap: 6px; }
